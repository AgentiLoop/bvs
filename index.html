<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           color: #f4f1ea; pointer-events: none; opacity: 0; text-shadow: 0 0 24px #000, 0 0 4px #000; letter-spacing: .12em; }
  #title h1 { margin: 0; font-size: 7vw; font-weight: 900; }
  #title h1 span { color: #c21a1a; font-size: .6em; vertical-align: middle; padding: 0 .3em; }
  #title p { margin: .6em 0 0; font: 1.4vw/1.2 monospace; letter-spacing: .3em; color: #aab; }
  #sub { position: fixed; left: 0; right: 0; bottom: 9vh; text-align: center; color: #dde; font: 1.6vw monospace;
         letter-spacing: .35em; opacity: 0; pointer-events: none; text-shadow: 0 0 6px #000; }
  #hud { position: fixed; left: 10px; bottom: 8px; color: #8890a0; font: 11px monospace; pointer-events: none; }
  #snd { position: fixed; right: 12px; bottom: 8px; color: #f4f1ea; font: bold 12px monospace; letter-spacing: .15em; padding: .5em .8em;
         background: rgba(194,26,26,.8); border: 1px solid #f4f1ea; cursor: pointer; animation: pulse 1.6s ease-in-out infinite; }
  #err { position: fixed; top: 0; left: 0; color: #f55; font: 12px monospace; white-space: pre; }
  #play { position: fixed; top: 4vh; left: 0; right: 0; display: flex; justify-content: center; gap: 2vw; }
  #play button { font: bold 1.3vw monospace; letter-spacing: .25em; padding: .8em 1.4em; color: #f4f1ea; background: rgba(10,12,18,.72);
                 border: 2px solid #f4f1ea; cursor: pointer; text-shadow: 0 0 6px #000; animation: pulse 1.6s ease-in-out infinite; }
  #play small { align-self: center; font: .9vw monospace; letter-spacing: .2em; color: #ccd; text-shadow: 0 0 6px #000; }
  #play button:hover { background: #c21a1a; }
  @keyframes pulse { 50% { border-color: #c21a1a; } }
  #game { position: fixed; inset: 0; pointer-events: none; display: none; color: #f4f1ea; font: bold 1.1vw monospace; letter-spacing: .2em; text-shadow: 0 0 6px #000; }
  .hp { position: absolute; top: 3vh; width: 38vw; }
  .hp b { display: block; height: 1.6vh; margin-top: .5vh; border: 2px solid #f4f1ea; background: rgba(0,0,0,.5); }
  .hp i { display: block; height: 100%; width: 100%; transition: width .15s; }
  #hpBatWrap { left: 4vw; } #hpBat i { background: linear-gradient(#ffd23a, #d79a10); }
  #hpSupWrap { right: 4vw; text-align: right; } #hpSup i { background: linear-gradient(#3a7bff, #c21a1a); margin-left: auto; }
  .hp b.mt { height: .8vh; width: 24vw; } #hpSupWrap b.mt { margin-left: auto; }
  .mt i { background: linear-gradient(#9ff, #39f); transition: width .1s; } .mt.full i { background: linear-gradient(#fff, #f6c400); animation: pulse2 .4s infinite alternate; }
  @keyframes pulse2 { to { filter: brightness(1.8); } }
  #timer { position: absolute; top: 2.2vh; left: 0; right: 0; text-align: center; font-size: 3vw; font-weight: 900; }
  .pips { color: #f6c400; letter-spacing: .1em; }
  #banner { position: fixed; left: 0; right: 0; top: 34vh; text-align: center; font-size: 6vw; font-weight: 900; letter-spacing: .12em; opacity: 0; transition: opacity .25s; }
  #combo { position: absolute; left: 4vw; right: 4vw; top: 12vh; font-size: 2.6vw; font-weight: 900; letter-spacing: .12em; opacity: 0; transition: opacity .3s; }
  #banner small { display: block; font: 1.2vw monospace; letter-spacing: .25em; margin-top: 1em; color: #ccd; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }

<body>
<div id="title"><h1>BATMAN<span>v</span>SUPERMAN</h1><p>EVERY PIXEL FROM CODE · THREE.JS</p></div>
<div id="sub"></div>
<div id="hud">Models: "Batman" by Salstar123, "Superman" by shreyhaldkar0 (Sketchfab, CC-BY-4.0) · P pixel-art · [ ] pixel size · C free camera · SPACE pause · R restart</div>
<div id="play"><button data-hero="bat">B · PLAY AS BATMAN</button><button data-hero="sup">S · PLAY AS SUPERMAN</button><small>GAMEPAD: X BATMAN · B SUPERMAN</small></div>
<div id="game">
  <div class="hp" id="hpBatWrap"><span id="tagBat">BATMAN</span><b id="hpBat"><i></i></b><b class="mt" id="mtBat"><i></i></b></div>
  <div class="hp" id="hpSupWrap"><span id="tagSup">SUPERMAN</span><b id="hpSup"><i></i></b><b class="mt" id="mtSup"><i></i></b></div>
  <div id="timer">60</div>
  <div id="combo"></div>
  <div id="banner"></div>
</div>
<div id="snd">&#128263; CLICK / PRESS ANY KEY FOR SOUND</div>
<div id="err"></div>
<script>window.addEventListener('error', e => { document.getElementById('err').textContent += e.message + '\n'; });</script>
<script type="module" src="./src/main.js"></script>
</body>
